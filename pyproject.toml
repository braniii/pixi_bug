[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = []
name = "packageD"
requires-python = ">= 3.11"
version = "0.1.0"

[dependency-groups]
dev = [ "packageA" ]

[tool.hatch]
[tool.hatch.build]
targets.wheel.packages = [ "src/packageD" ]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
packageD = { path = ".", editable = true }
packageA = "*"

[tool.pixi.tasks]

[tool.pixi.environments]
dev = [ "dev" ]

[tool.uv]
[tool.uv.sources]
packageA = { git = "https://github.com/braniii/pixi_bug.git", rev = "packageA" }
